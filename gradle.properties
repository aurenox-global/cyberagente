org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Firma de release.
# Los valores por defecto apuntan a keystore/cyberagent-release.jks (keystore propio,
# NO el certificado de depuración de Android).
# En CI sobrescribe con: CYBERAGENT_STORE_FILE / CYBERAGENT_STORE_PASSWORD /
# CYBERAGENT_KEY_ALIAS / CYBERAGENT_KEY_PASSWORD
cyberagent.storeFile=keystore/cyberagent-release.jks
cyberagent.storePassword=cyberagent-release
cyberagent.keyAlias=cyberagent
cyberagent.keyPassword=cyberagent-release
